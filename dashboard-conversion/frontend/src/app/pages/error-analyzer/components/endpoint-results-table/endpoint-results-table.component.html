<div *ngIf="results.length > 0" class="results-card">
  <div class="results-header">
    <div class="results-title">
      Found {{ results.length }} unique endpoint(s)
      <span *ngIf="limitReached" class="results-limit">(showing first 500 — narrow the search to see all)</span>
    </div>
  </div>
  <div class="results-table-wrap">
    <table class="results-table">
      <thead>
        <tr>
          <th>Method</th>
          <th>URL path</th>
          <th>Service</th>
          <th>Server address</th>
          <th>Hits</th>
          <th>Last seen</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of results; trackBy: trackByEndpoint" class="results-row">
          <td><span class="method-badge">{{ r.method || '—' }}</span></td>
          <td class="cell-path" [title]="r.urlPath">{{ r.urlPath }}</td>
          <td class="cell-truncate" [title]="r.service">{{ r.service || '—' }}</td>
          <td class="cell-truncate" [title]="r.serverAddress">{{ r.serverAddress || '—' }}</td>
          <td class="cell-count">{{ r.count }}</td>
          <td>{{ formatTime(r.lastSeen) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
