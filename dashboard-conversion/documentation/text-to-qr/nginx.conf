server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static single page app fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Helpful cache policy while developing
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
