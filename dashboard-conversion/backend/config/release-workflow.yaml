# =============================================================================
# Release Workflow — workflow definition
# =============================================================================
#
# This file defines the entire CDB release workflow: 10 stages, their
# sub-steps, and the runners that auto-tick those sub-steps.
#
# At boot, the loader:
#   1. Reads this file
#   2. Validates structure against the schema
#   3. Looks up runner names against the registered factory library
#   4. Synthesizes per-sub-step automated checks
#   5. Builds STAGE_TEMPLATE and STAGE_RUNNERS
#   6. Existing releases reconcile against the new template structure
#
#  Available runners (all take `field` implicitly from the sub-step):
#    confluencePageIdCheck    — field holds a Confluence page ID
#    confluencePageUrlCheck   — field holds a Confluence page URL
#    githubPrUrlCheck         — field holds a GitHub PR URL
#    githubBranchUrlCheck     — field holds a GitHub branch URL (in /tree/ form)
#    jiraFixVersionCheck      — field holds a JIRA Fix Version name
#    jiraTicketUrlCheck       — field holds a JIRA ticket URL (or bare key)
#    valueIsSetCheck          — field is non-empty (any value passes)
#
#  fieldPath is either a top-level metadata field (e.g. 'intakePageId') or
#  a nested branches path (e.g. 'branches.cdbUiConfigs').
#
#  Tracks: every sub-step declares its application track. Stages whose
#  sub-steps span multiple tracks render with section headers (Generic →
#  CDB UI → CDBBOS); single-track stages render as a flat list.
#
# =============================================================================

stages:

  # ===========================================================================
  - id: stage1-intake
    name: Intake & Setup
    initialStatus: ready
    dependsOn: []
    subSteps:
      - id: add-confluence-page-link
        label: Add Release Confluence page link
        track: generic
        editableField: intakePageId
        runner: confluencePageUrlCheck
      - id: confirm-env-allocation
        label: Confirm env allocation (Self Serve link)
        track: generic
        helpUrl:abc
        helpUrlLabel: abc
      - id: create-fix-version
        label: Create Release Fix Version in JIRA
        track: generic
        editableField: fixVersion
        runner: jiraFixVersionCheck
      - id: raise-env-matrix-pr
        label: Raise PR to onboard branch on Env Matrix
        track: generic
        editableField: envMatrixPrUrl
        runner: githubPrUrlCheck

  # ===========================================================================
  - id: stage2-branching
    name: Branching & Configs
    dependsOn: [stage1-intake]
    subSteps:
      # ---- CDB UI (frontend) ----
      - id: create-cdb-ui-configs-branch
        label: Create CDB UI Configs branch off master
        track: cdbui
        placeholder: Enter the branch URL - abc
        editableField: branches.cdbUiConfigs
        runner: githubBranchUrlCheck
      - id: email-adms
        label: Email ADMs/devs from Scope Intake (CDB UI)
        track: cdbui
      - id: open-master-jira
        label: Open master JIRA "CDB UI Configs - RXX"
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Example  Master Ticket
        editableField: cdbUiConfigJiraUrl
        runner: jiraTicketUrlCheck
      - id: add-da-team-subtasks
        label: Add subtasks per DA team (CDB UI)
        track: cdbui
      - id: run-configs-report
        label: Run CDB_Release_Configs_Report in QA Signoff env
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Reporting Pipeline
      # ---- CDBBOS (backend) ----
      - id: create-cdbbos-config-branch
        label: Create CDBBOS Config branch off master
        track: cdbbos
        editableField: cdbbosConfigBranchUrl
        runner: githubBranchUrlCheck
      - id: create-cdbbos-release-branch
        label: Create CDBBOS release branch off master
        track: cdbbos
        editableField: cdbbosReleaseBranchUrl
        runner: githubBranchUrlCheck
      - id: create-cdb-swagger-branch
        label: Create CDB Swagger release branch off master
        track: cdbbos
        editableField: cdbSwaggerBranchUrl
        runner: githubBranchUrlCheck
      - id: create-dependency-jar-branches
        label: Create Dependency JAR release branches for each applicable repo
        track: cdbbos
        editableField: dependencyJarBranchUrls
        runner: githubBranchUrlsMultiCheck
      - id: email-cdbbos-adms
        label: Email ADMs/devs from Scope Intake (CDBBOS)
        track: cdbbos
      - id: open-cdbbos-master-jira
        label: Open master JIRA "CDBBOS Configs - RXX"
        track: cdbbos
        editableField: cdbbosJiraUrl
        runner: jiraTicketUrlCheck
      - id: add-cdbbos-da-team-subtasks
        label: Add subtasks per DA team (CDBBOS)
        track: cdbbos

  # ===========================================================================
  - id: stage3-build-stabilization
    name: Build Stabilization (T-7)
    dependsOn: [stage2-branching]
    subSteps:
      - id: coordinate-platform-qa-go-no-go
        label: Coordinate with Platform QA on stable commit
        track: generic
      - id: disable-sealights-pr
        label: Disable Sealights via config PR
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Sample CDB UI Pull Request
        editableField: sealightsDisablePrUrl
        runner: githubPrUrlCheck
      - id: run-automated-build-pipeline
        label: Run Automated Build Pipeline post-toggle
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Open ADO pipeline
      - id: confirm-clean-qa-builds
        label: Confirm clean QA deployment builds generated
        track: generic

  # ===========================================================================
  - id: stage4-mobile-build
    name: Mobile Build & Distribution (T-5 to T-4)
    dependsOn: [stage3-build-stabilization]
    subSteps:
      - id: confirm-package-json-version
        label: Confirm package.json reflects release version
        track: cdbui
      - id: update-mobile-versions-table
        label: Update Mobile App Versions Table
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Mobile App Versions Table
      - id: run-blue-mobile-buildu
        label: Run CDB_PROD_Blue_Mobile_Build_Publish
        track: cdbui
        helpUrl: abc
        helpUrlLabel: CDB_PROD_Blue_Mobile_Build_Publish Pipeline
      - id: run-green-mobile-build
        label: Run CDB_PROD_Green_Mobile_Build_Publish
        track: cdbui
        helpUrl: abc
        helpUrlLabel: CDB_PROD_Green_Mobile_Build_Publish Pipeline
      - id: run-prod-mobile-build
        label: Run CDB_PROD_Mobile_Build_Publish
        track: cdbui
        helpUrl: abc
        helpUrlLabel: CDB_PROD_Mobile_Build_Publish Pipeline
      - id: upload-ios-pre-prod
        label: Upload iOS Pre-PROD → TestFlight
        track: cdbui
      - id: share-android-pre-prod-path
        label: Share Android Pre-PROD build path
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Android Pre-PROD build path
      - id: distribute-iOS-builds
        label: Distribute iOS builds
        track: cdbui
        helpUrl: abc
        helpUrlLabel: iOS App Upload - Test flight Link
      - id: distribute-andriod-builds
        label: Distribute PROD Android builds
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Android App Upload - Google Playstore Link
      - id: inform-buisness
        label: Inform Buisness (Frey Dylan) that Mobile bulds are in playstore and appstore
        track: cdbui
      - id: share-pre-prod-mobile
        label: Share Preprod iOS and Android Mobile App Build Links with Release Mgmt
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Example - Pre Prod Build (Colour Specific)
      - id: share-pre-prod-android
        label: Share Prod iOS and Android Mobile App Build Links with Release Mgmt
        track: cdbui
        helpUrl: acb
        helpUrlLabel: Example - Prod Build

  # ===========================================================================
  - id: stage5-war-promotion
    name: Artifact Promotion (T-4 to T-3)
    dependsOn: [stage4-mobile-build]
    subSteps:
      - id: promote-cdbui-war-azure
        label: Promote CDB UI WAR via Azure pipeline
        track: cdbui
        helpUrl: abc
        helpUrlLabel: Promote CDA EAR Artifact
        editableField: cdbUiArtifactPath
        runner: artifactExistsCheck
      - id: promote-cdbbos-ear-azure
        label: Promote CDBBOS EAR build into PROD Artifactory (Azure pipeline)
        track: cdbbos
        helpUrl: abc
        helpUrlLabel: Promote CDA EAR Artifact
        editableField: cdbbosEarArtifactPath
        runner: artifactExistsCheck
      - id: promote-cdbbos-config-build
        label: Prepare and promote CDBBOS Config build into PROD Artifactory
        track: cdbbos
        editableField: cdbbosConfigArtifactPath
        runner: artifactExistsCheck

  # ===========================================================================
  # Stage 6 unlocks as soon as Stage 3 completes; runs alongside Stages 4 & 5.
  # Stage 7 lists this in its own dependsOn, so Stage 7 can't open until 6 closes.
  - id: stage6-doc-prep
    name: Documentation Prep
    kind: parallel
    dependsOn: [stage3-build-stabilization]
    blocks: [stage7-pre-prod]
    subSteps:
      - id: draft-pre-prod-letter
        label: Draft Pre-PROD delivery letter
        track: generic
        editableField: preProdLetterUrl
        runner: confluencePageUrlCheck
      - id: draft-prod-letter
        label: Draft PROD delivery letter
        track: generic
        editableField: prodLetterUrl
        runner: confluencePageUrlCheck
      - id: close-jira-subtasks
        label: Close JIRA subtasks + master ticket for UI Configs
        track: cdbui

  # ===========================================================================
  - id: stage7-pre-prod
    name: Pre-PROD Deployment
    dependsOn: [stage5-war-promotion, stage6-doc-prep]
    subSteps:
      - id: deploy-configs-wem
        label: Deploy configs to PROD WEM server
        track: cdbui
        helpUrl: abv
        helpUrlLabel: PROD WEM Server
      - id: execute-tech-validation
        label: Execute technical validation per CDB Release runbook
        track: generic
        helpUrl: avbc
        helpUrlLabel: Tech Validation Runbook

  # ===========================================================================
  - id: stage8-prod
    name: PROD Deployment
    dependsOn: [stage7-pre-prod]
    subSteps:
      - id: repeat-config-war-verification
        label: Repeat config/WAR verification
        track: generic
      - id: coordinate-traffic-switch
        label: Coordinate traffic switch per PROD delivery letter
        track: generic
      - id: execute-tech-validation-prod
        label: Execute technical validation
        track: generic
        helpUrl: abc
        helpUrlLabel: Tech Validation Runbook

  # ===========================================================================
  - id: stage9-post-go-live
    name: Post-Go-Live
    dependsOn: [stage8-prod]
    subSteps:
      - id: update-f26-deployments-page
        label: Update build versions on F26 Deployments page
        track: generic
        helpUrl: abc
        helpUrlLabel: F26 Deployment Versions
      - id: retrofit-cdb-ui-branch
        label: Retrofit CDB UI release branch → master
        track: cdbui
        editableField: retrofitCdbUiPrUrl
        runner: githubPrUrlCheck      
      - id: retrofit-cdb-configs-branch
        label: Retrofit CDB Configs release branch → master
        track: cdbui
        editableField: retrofitCdbConfigsPrUrl
        runner: githubPrUrlCheck
      - id: retrofit-freddy-branch
        label: Retrofit Freddy release branch → master
        track: cdbui
        editableField: retrofitFreddyPrUrl
        runner: githubPrUrlCheck
      - id: retrofit-cdbbos-branch
        label: Retrofit CDBBOS release branch → master
        track: cdbbos
        editableField: retrofitCdbbosPrUrl
        runner: githubPrUrlCheck
      - id: retrofit-cdbbos-config-branch
        label: Retrofit CDBBOS Config release branch → master
        track: cdbbos
        editableField: retrofitCdbbosConfigPrUrl
        runner: githubPrUrlCheck
      - id: tag-cdb-ui
        label: Tag CDB UI repo
        track: cdbui
        editableField: tagCdbUiUrl
        runner: githubTagUrlCheck
      - id: tag-cdb-configs
        label: Tag CDB Configs repo
        track: cdbui
        editableField: tagCdbConfigsUrl
        runner: githubTagUrlCheck
      - id: tag-freddy
        label: Tag Freddy repo
        track: cdbui
        editableField: tagFreddyUrl
        runner: githubTagUrlCheck
      - id: tag-cdbbos
        label: Tag CDBBOS repo
        track: cdbbos
        editableField: tagCdbbosUrl
        runner: githubTagUrlCheck
      - id: tag-cdbbos-config
        label: Tag CDBBOS Config repo
        track: cdbbos
        editableField: tagCdbbosConfigUrl
        runner: githubTagUrlCheck

  # ===========================================================================
  - id: stage10-post-mobile
    name: Post Mobile App Release
    dependsOn: [stage9-post-go-live]
    subSteps:
      - id: upload-prod-dsym-firebase
        label: Upload PROD dSYM files to Firebase Console
        track: cdbui