# =============================================================================
# Release Workflow — workflow definition
# =============================================================================
#
# This file defines the entire CDB release workflow: 10 stages, their
# sub-steps, and the runners that auto-tick those sub-steps.
#
# Editing this file:
#   - Locally: edit the bundled file at backend/src/config/release-workflow.yaml
#     and restart the backend.
#   - Deployed (OpenShift): edit the ConfigMap mounted at the same path
#     and restart the pod.
#
# At boot, the loader:
#   1. Reads this file
#   2. Validates structure against the schema
#   3. Looks up runner names against the registered factory library
#   4. Synthesizes per-sub-step automated checks
#   5. Builds STAGE_TEMPLATE and STAGE_RUNNERS
#   6. Existing releases reconcile against the new template structure
#
# If validation fails, the pod fails to start with a clear error message.
#
# -----------------------------------------------------------------------------
#  Schema reference
# -----------------------------------------------------------------------------
#
#  stages:
#    - id: <slug>                  (required, stable identifier)
#      name: <human-readable>      (required, displayed in UI)
#      kind: <sequential|parallel> (default: 'sequential'; parallel runs alongside
#                                   other stages once dependsOn is met)
#      initialStatus: <ready|locked>
#                                  (default: 'locked'; first stage uses 'ready')
#      dependsOn: [stageId, ...]   (default: []; empty for first stage)
#      blocks: [stageId, ...]      (parallel stages only; sequential stages they
#                                   must close before. Optional.)
#      subSteps:
#        - id: <slug>              (required, scoped to stage)
#          label: <human-readable> (required)
#          editableField: <fieldPath>
#                                  (required if `runner` is set; names the
#                                   metadata field this sub-step's inline input
#                                   writes to)
#          runner: <factoryName>   (optional; if set, this sub-step is
#                                   auto-tickable. Must match a registered
#                                   factory in FACTORY_REGISTRY. The runner
#                                   is invoked with field=editableField.)
#                                  (omit `runner` for purely manual sub-steps —
#                                   they render as a checkbox)
#          placeholder: <string>   (optional; placeholder text for the inline
#                                   input field. Overrides the runner's
#                                   default. Useful for custom phrasing or
#                                   to provide an example value.)
#
#  Available runners (all take `field` implicitly from the sub-step):
#    confluencePageIdCheck    — field holds a Confluence page ID
#    confluencePageUrlCheck   — field holds a Confluence page URL
#    githubPrUrlCheck         — field holds a GitHub PR URL
#    githubBranchUrlCheck     — field holds a GitHub branch URL (in /tree/ form)
#    jiraFixVersionCheck      — field holds a JIRA Fix Version name
#    valueIsSetCheck          — field is non-empty (any value passes)
#
#  fieldPath is either a top-level metadata field (e.g. 'intakePageId') or
#  a nested branches path (e.g. 'branches.cdbUiConfigs').
#
# =============================================================================

stages:

  # ===========================================================================
  - id: stage1-intake
    name: Intake & Setup
    initialStatus: ready
    dependsOn: []
    subSteps:
      - id: add-confluence-page-link
        label: Add Release Confluence page link
        editableField: intakePageId
        runner: confluencePageIdCheck
      - id: confirm-env-allocation
        label: Confirm env allocation (Self Serve link)
        editableField: intakeSheetUrl
        runner: confluencePageUrlCheck
      - id: create-fix-version
        label: Create Fix Version in JIRA
        editableField: fixVersion
        runner: jiraFixVersionCheck
      - id: add-intake-checklist-page-id
        label: Add Intake Checklist Page ID in Admin Portal
        editableField: intakePageId
        runner: valueIsSetCheck
      - id: raise-env-matrix-pr
        label: Raise PR to onboard branch on Env Matrix
        editableField: envMatrixPrUrl
        runner: githubPrUrlCheck

  # ===========================================================================
  - id: stage2-branching
    name: Branching & Configs (T-14)
    dependsOn: [stage1-intake]
    subSteps:
      - id: create-cdb-ui-configs-branch
        label: Create CDB UI Configs branch off master
        editableField: branches.cdbUiConfigs
        runner: githubBranchUrlCheck
      - id: email-adms
        label: Email ADMs/devs from Scope Intake
      - id: open-master-jira
        label: Open master JIRA "CDB UI Configs - RXX"
      - id: add-da-team-subtasks
        label: Add subtasks per DA team
      - id: run-configs-report
        label: Run CDB_Release_Configs_Report in QA Signoff env

  # ===========================================================================
  - id: stage3-build-stabilization
    name: Build Stabilization (T-7)
    dependsOn: [stage2-branching]
    subSteps:
      - id: coordinate-platform-qa-go-no-go
        label: Coordinate with Platform QA on stable commit
      - id: disable-sealights-pr
        label: Disable Sealights via config PR
      - id: run-automated-build-pipeline
        label: Run Automated Build Pipeline post-toggle
      - id: confirm-clean-qa-builds
        label: Confirm clean QA deployment builds generated

  # ===========================================================================
  - id: stage4-mobile-build
    name: Mobile Build & Distribution (T-5 to T-4)
    dependsOn: [stage3-build-stabilization]
    subSteps:
      - id: confirm-package-json-version
        label: Confirm package.json version (PROD 0/3/6, Blue 1/4/7, Green 2/5/8)
      - id: update-mobile-versions-table
        label: Update Mobile App Versions Table
      - id: run-blue-mobile-build
        label: Run CDB_PROD_Blue_Mobile_Build_Publish
      - id: run-green-mobile-build
        label: Run CDB_PROD_Green_Mobile_Build_Publish
      - id: run-prod-mobile-build
        label: Run CDB_PROD_Mobile_Build_Publish
      - id: upload-ios-pre-prod
        label: Upload iOS Pre-PROD → TestFlight
      - id: share-android-pre-prod-path
        label: Share Android Pre-PROD build path
      - id: distribute-prod-builds
        label: Distribute PROD Android + iOS builds
      - id: share-build-links
        label: Share Mobile App Build Links with Release Mgmt

  # ===========================================================================
  - id: stage5-war-promotion
    name: WAR Promotion (T-4 to T-3)
    dependsOn: [stage4-mobile-build]
    subSteps:
      - id: promote-war-azure
        label: Promote WAR via Azure pipeline (definitionId=8398)

  # ===========================================================================
  # Stage 6 unlocks as soon as Stage 3 completes; runs alongside Stages 4 & 5.
  # Stage 7 lists this in its own dependsOn, so Stage 7 can't open until 6 closes.
  - id: stage6-doc-prep
    name: Documentation Prep
    kind: parallel
    dependsOn: [stage3-build-stabilization]
    blocks: [stage7-pre-prod]
    subSteps:
      - id: draft-pre-prod-letter
        label: Draft Pre-PROD delivery letter
      - id: draft-prod-letter
        label: Draft PROD delivery letter
      - id: close-jira-subtasks
        label: Close JIRA subtasks + master ticket for UI Configs

  # ===========================================================================
  - id: stage7-pre-prod
    name: Pre-PROD Deployment
    dependsOn: [stage5-war-promotion, stage6-doc-prep]
    subSteps:
      - id: deploy-configs-wem
        label: Deploy configs to PROD WEM server
      - id: validate-3-4-passes
        label: Validate 3-4 passes
      - id: execute-tech-validation
        label: Execute technical validation per CDB Release runbook

  # ===========================================================================
  - id: stage8-prod
    name: PROD Deployment
    dependsOn: [stage7-pre-prod]
    subSteps:
      - id: repeat-config-war-verification
        label: Repeat config/WAR verification
      - id: execute-tech-validation-prod
        label: Execute technical validation
      - id: coordinate-traffic-switch
        label: Coordinate traffic switch per PROD delivery letter

  # ===========================================================================
  - id: stage9-post-go-live
    name: Post-Go-Live
    dependsOn: [stage8-prod]
    subSteps:
      - id: update-f26-deployments-page
        label: Update build versions on F26 Deployments page
      - id: retrofit-cdb-ui-branch
        label: Retrofit CDB UI release branch → master
      - id: retrofit-cdb-configs-branch
        label: Retrofit CDB Configs release branch → master
      - id: retrofit-freddy-branch
        label: Retrofit Freddy release branch → master
      - id: tag-repos
        label: Tag repos (CDB, CDB_configs, Freddy)

  # ===========================================================================
  - id: stage10-post-mobile
    name: Post Mobile App Release
    dependsOn: [stage9-post-go-live]
    subSteps:
      - id: upload-prod-dsym-firebase
        label: Upload PROD dSYM files to Firebase Console
